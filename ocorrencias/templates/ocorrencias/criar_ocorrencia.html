{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Ocorrência | Escola Inteligente</title>

    <link rel="stylesheet"
          href="{% static 'ocorrencias/css/style.css' %}">
</head>

<body>

    <main class="container">

        <header class="cabecalho">
            <div class="logo">🏫</div>

            <h1>Registrar ocorrência</h1>

            <p>
                Informe o problema encontrado na infraestrutura da escola.
            </p>
        </header>


        <div class="form-card">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="botao botao-form">
                    Enviar ocorrência
                </button>

            </form>

        </div>


        <div class="voltar">

            <a href="{% url 'inicio' %}">
                ← Voltar ao início
            </a>

        </div>

    </main>

</body>
</html>
